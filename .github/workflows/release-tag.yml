# release-tag.yml — validate a merged release PR and create the annotated tag.
#
# Triggered manually with a verified release merge SHA on main.
# Also triggered on PR merge to main with title "chore(release): X.Y.Z".
# Uses native git only — no external actions (org policy: allowed_actions=local_only).

name: release-tag

on:
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:
    inputs:
      merge_sha:
        description: "Verified release merge commit SHA on main"
        required: false
        default: ""

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (native git)
        run: |
          set -euo pipefail
          git clone --no-checkout "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" repo
          cd repo
          git checkout main
          echo "Checked out main"

      - name: Verify merge commit
        id: verify
        working-directory: repo
        run: |
          set -uo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SHA="${{ github.event.inputs.merge_sha }}"
            if [ -z "$SHA" ]; then
              echo "::error::No merge_sha provided — cannot tag."
              exit 1
            fi
          else
            TITLE="${{ github.event.pull_request.title }}"
            MERGED="${{ github.event.pull_request.merged }}"
            if [ "$MERGED" != "true" ] || [[ "$TITLE" != chore\(release\):* ]]; then
              echo "Not a merged release PR — skipping."
              exit 0
            fi
            PR_NUMBER="${{ github.event.pull_request.number }}"
            SHA="$(git log --merges --grep="Merge pull request #${PR_NUMBER}" --format='%H' -1)"
            if [ -z "$SHA" ]; then
              echo "::error::Could not find merge commit for PR #${PR_NUMBER}."
              exit 1
            fi
          fi

          if ! git cat-file -e "${SHA}^{commit}" 2>/dev/null; then
            echo "::error::SHA $SHA is not a valid commit."
            exit 1
          fi
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Extract version
        id: version
        working-directory: repo
        run: |
          SHA="${{ steps.verify.outputs.sha }}"
          if [ -z "$SHA" ]; then
            echo "No SHA — skipping."
            exit 0
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PARENT="$(git rev-parse --verify "$SHA^2" 2>/dev/null || git rev-parse --verify "$SHA^")"
            MSG="$(git log -1 --format='%s' "$PARENT")"
          else
            TITLE="${{ github.event.pull_request.title }}"
            MSG="chore(release): ${TITLE#chore(release):}"
          fi

          if [[ "$MSG" =~ chore\(release\):\ v?([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            VERSION="${BASH_REMATCH[1]}"
          else
            echo "::error::Cannot extract version from: $MSG"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create annotated tag
        working-directory: repo
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHA="${{ steps.verify.outputs.sha }}"
          if [ -z "$VERSION" ] || [ -z "$SHA" ]; then
            echo "No version or SHA — skipping."
            exit 0
          fi
          TAG="v${VERSION}"

          if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} already exists."
            exit 1
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG}" "${SHA}"

          if [ -n "${{ secrets.TAGGING_TOKEN }}" ]; then
            TOKEN="${{ secrets.TAGGING_TOKEN }}"
          else
            TOKEN="${{ github.token }}"
          fi
          git push "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" "${TAG}:refs/tags/${TAG}"
          echo "Created and pushed tag ${TAG} → ${SHA}"